# UNVERIFIED: this workflow has never executed. The epic deliberately stops
# short of deployment — no remote, no GitHub App, no Pages configuration — so
# checkout, install, check, build, the clean-pages gate, artifact upload and
# deploy are authored and committed but unrun.
name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: pnpm run build

      - name: Assert content pages ship no CMS JavaScript
        run: pnpm run assert:clean-pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
